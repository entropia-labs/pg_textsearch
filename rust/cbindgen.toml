language = "C"
header = """/* Auto-generated by cbindgen. Do not edit. */
/* Copyright (c) 2025-2026 Tiger Data, Inc. */
"""
include_guard = "PG_TEXTSEARCH_RUST_H"
no_includes = true
sys_includes = ["stdint.h", "stdbool.h", "stddef.h"]
style = "both"
tab_width = 4
documentation_style = "c"

[defines]

[export]
prefix = ""
include = []
# Exclude types and constants already defined in C headers.
# Rust-only internal types (PostingEntry, TermInfo, etc.) are
# not #[repr(C)] FFI types and won't be exported by cbindgen.
exclude = [
    "TpBlockPosting", "TpCompressedBlockHeader",
    "TP_BLOCK_SIZE", "TP_MAX_COMPRESSED_BLOCK_SIZE",
    "TpDictEntry", "TpSkipEntry", "TpSegmentHeader",
    "TP_SEGMENT_MAGIC", "TP_SEGMENT_FORMAT_VERSION",
    "TP_SEGMENT_FORMAT_V3", "TP_SEGMENT_FORMAT_V4",
    "TP_BLOCK_FLAG_UNCOMPRESSED", "TP_BLOCK_FLAG_DELTA",
    "TP_TENANT_MODE_NONE", "TP_TENANT_MODE_SINGLE",
    "TP_TENANT_MODE_MIXED", "TP_FLAG_HAS_TENANT_DATA",
    "TpTenantStats", "TpTenantDocFreq",
]

[export.rename]

[enum]
rename_variants = "ScreamingSnakeCase"

[fn]
sort_by = "None"

[struct]
rename_fields = "None"
